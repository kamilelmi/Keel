<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="description" content="Habits, journal, focus timer and days-since counters. Works offline.">
<title>Keel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/*
VOICE   calm, practical, a daily tool you open twenty times a day
IDEA    a pocket planner: one page per day, tick boxes, a margin for notes
PICTURE the working thing itself: tick rows, the focus ring, the big day counts
COLOUR  white paper / near-black night, one cobalt accent, habit colours as ink
TYPE    system UI stack (loads offline), tabular numbers for anything that ticks
LAYOUT  bottom tab bar on the phone cover screen, side rail + two columns when unfolded or on the laptop
*/
:root{color-scheme:light dark;
--bg:light-dark(#f2f3f5,#0e1014);--card:light-dark(#ffffff,#171a20);--card2:light-dark(#f6f7f9,#1e222a);
--ink:light-dark(#14161b,#eceef3);--mute:light-dark(#5a606b,#9aa2af);--line:light-dark(#e1e4e9,#272c35);
--acc:light-dark(#2f5bea,#7d9bff);--acc-soft:light-dark(#e7edff,#1f2849);--on-acc:light-dark(#ffffff,#0a0f22);
--good:light-dark(#178a4c,#4cc38a);--bad:light-dark(#c63636,#ff7d7d);--r:18px;--nav:68px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Noto Sans",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.15}
h2{font-size:18px}h3{font-size:17px}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)}.small{font-size:13px}
.num-t{font-variant-numeric:tabular-nums}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 0;color:var(--mute);font-size:12px;font-weight:600;min-height:52px;white-space:nowrap}
.nav .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
.nav button.on{color:var(--ink)}
.nav button.on .ic{background:var(--acc-soft);color:var(--acc)}
.brand{display:none}
main{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(var(--nav) + 40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.top h1{flex:1;font-size:clamp(26px,6vw,34px);letter-spacing:-.015em;text-wrap:balance}
.top h1 .sub{display:block;font-size:14px;font-weight:600;color:var(--mute);letter-spacing:0;margin-bottom:4px}
@media(min-width:760px){
 .nav{inset:0 auto 0 0;width:96px;flex-direction:column;gap:4px;padding:18px 8px;border-top:0;border-right:1px solid var(--line)}
 .nav button{flex:none;min-height:64px}
 .brand{display:grid;place-items:center;margin:0 auto 14px}
 .brand img{width:40px;height:40px;border-radius:11px}
 main{padding:24px 36px 48px calc(96px + 36px)}
}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack-g{display:grid;gap:16px;align-content:start}
.cols{display:grid;gap:16px}
@media(min-width:880px){.cols{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch>h2,.ch>h3,.ch>.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{width:18px;height:18px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--mute);flex:none}
.ibtn:hover{background:var(--card2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],input[type=datetime-local],textarea,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:16px}
textarea{min-height:240px;resize:vertical;line-height:1.65;display:block}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.empty{color:var(--mute);padding:14px 0;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:18px}
.sp{flex:1}

/* today */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:14px;font-weight:600;color:var(--mute)}
.stat span{font-size:13px;color:var(--mute);font-weight:500}
.prog{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin:-2px 0 8px}
.prog i{display:block;height:100%;background:var(--good);border-radius:9px;transition:width .3s}
.hrow{display:flex;align-items:center;gap:14px;width:100%;padding:10px 6px;border:0;background:none;border-radius:12px;text-align:left;min-height:56px}
.hrow:hover{background:var(--card2)}
.tick{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--c);flex:none;transition:background .15s}
.tick svg{width:18px;height:18px;stroke:#fff;stroke-width:3;opacity:0}
.done .tick{background:var(--c)}.done .tick svg{opacity:1}
.hname{flex:1;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.hcard h3,.scard h3,.mini span{overflow-wrap:anywhere}
.done .hname{color:var(--mute)}
.hmeta{font-size:13px;color:var(--mute);white-space:nowrap}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow .btn{width:44px;padding:0;flex:none}
.todo{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.cb{display:grid;place-items:center;width:44px;height:44px;border:0;background:none;flex:none;margin-left:-8px}
.cb i{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:2px solid var(--mute)}
.cb svg{width:15px;height:15px;stroke-width:3;opacity:0;stroke:var(--on-acc)}
.todo.done .cb i{background:var(--acc);border-color:var(--acc)}.todo.done .cb svg{opacity:1}
.todo .tt{flex:1;overflow-wrap:anywhere}
.todo.done .tt{color:var(--mute);text-decoration:line-through}
.qmoods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.mini{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.mini:last-child{border-bottom:0}
.mini b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.mini span{flex:1;font-weight:600}
.mini small{color:var(--mute)}
.qfocus{display:flex;align-items:center;gap:14px}
.qfocus .big2{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* habits */
.hgrid{display:grid;gap:14px}
@media(min-width:880px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.hcard h3{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.hstats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mute);margin:-4px 0 14px}
.hstats b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:2px 0;font-size:12px;font-weight:600;color:var(--mute)}
.wd i{display:grid;place-items:center;width:100%;max-width:42px;aspect-ratio:1;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 50%,transparent);font-style:normal;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.wd.on i{background:var(--c);border-color:var(--c);color:#fff}
.wd.off:not(.on) i{border-style:dashed;border-color:var(--line);color:var(--mute)}
.wd.today span{color:var(--ink)}
details.hist{margin-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--mute);min-height:36px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 10px 0 4px;transition:transform .2s}
details[open]>summary::before{transform:rotate(45deg)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow-x:auto;padding:6px 0}
.heat b{border-radius:3px;background:var(--card2)}
.heat b.s{background:color-mix(in srgb,var(--c) 14%,var(--card2))}
.heat b.y{background:var(--c)}
.heat b.f{visibility:hidden}
.emptybig{display:grid;gap:14px;justify-items:start;padding:24px}
.emptybig h2{font-size:22px}

/* focus */
.focus{display:grid;justify-items:center;gap:14px;text-align:center}
.ringw{position:relative;width:min(76vw,330px);aspect-ratio:1}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--card2);stroke-width:11}
.prg{fill:none;stroke:var(--mc);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.ringt{position:absolute;inset:0;display:grid;place-content:center;gap:6px}
.big{font-size:clamp(54px,15vw,78px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ctl{display:flex;align-items:center;gap:22px}
.go{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;border:0;background:var(--mc);color:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--mc) 35%,transparent)}
.go svg{width:32px;height:32px;stroke-width:2.5}
.go svg.fillc{fill:currentColor;stroke:none}
.ctl .ibtn{width:52px;height:52px;border-radius:50%;background:var(--card2)}
.focus .lbl{max-width:420px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px;margin-top:8px}
.bar{display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:6px;height:100%;font-size:12px;color:var(--mute);font-weight:600}
.bar u{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:100%;height:100%;text-decoration:none}
.bar i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--acc);min-height:3px}
.bar.t i{background:var(--ink)}
.bar em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.sess{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sess:last-child{border-bottom:0}
.sess time{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.sess span{flex:1;overflow-wrap:anywhere}
.fset{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
@media(max-width:520px){.fset{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fset label,.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.tog{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:500;color:var(--ink)}
.tog input{width:20px;height:20px;accent-color:var(--acc)}

/* journal */
.jbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.jbar input{flex:1;max-width:220px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.mood{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:60px;border:1px solid var(--line);background:var(--card2);border-radius:12px;font-size:13px;font-weight:600;padding:4px 2px}
.mood i{width:16px;height:16px;border-radius:50%;background:var(--m)}
.mood.on{border-color:var(--m);background:color-mix(in srgb,var(--m) 18%,var(--card));box-shadow:inset 0 0 0 1px var(--m)}
.prompts{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.prompts .chip{flex:none;min-height:36px;font-weight:500}
.jfoot{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.mstrip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;margin:6px 0 4px}
.mstrip b{aspect-ratio:1/2.2;border-radius:4px;background:var(--card2)}
.jent{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;border-radius:0}
.jent:last-child{border-bottom:0}
.jent.cur{background:var(--card2);border-radius:12px}
.jd{display:grid;justify-items:center;width:44px;flex:none;font-size:12px;color:var(--mute);font-weight:600;line-height:1.1}
.jd b{font-size:22px;color:var(--ink)}
.jb{display:grid;gap:2px;flex:1}
.jt{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);font-weight:600}
.md{width:10px;height:10px;border-radius:50%;background:var(--m);display:inline-block}
.jx{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* days since */
.sgrid{display:grid;gap:14px}
@media(min-width:700px){.sgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}}
.scard .dn{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px}
.scard .num{font-size:clamp(64px,16vw,88px);font-weight:800;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.scard .dl{font-size:20px;font-weight:700;color:var(--mute)}
.hms{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600;font-size:15px}
.ms{margin:16px 0 14px}
.ms .prog{margin:0 0 6px;height:8px}
.ms .prog i{background:var(--acc)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.meta div{background:var(--card2);border-radius:12px;padding:8px 10px}
.meta dt{font-size:12px;color:var(--mute);font-weight:600}
.meta dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.rlist{display:grid;gap:8px;margin-top:6px;font-size:14px}
.rlist div{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}
.rlist em{font-style:normal;color:var(--mute);display:block}

/* dialogs and toast */
dialog{border:0;border-radius:22px;background:var(--card);color:var(--ink);padding:22px;width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgb(0 0 0/.5)}
dialog h2{font-size:22px;margin-bottom:16px}
dialog .fld{margin-bottom:16px}
dialog .fld>span{font-size:13px}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
.sw-row{display:flex;flex-wrap:wrap;gap:10px}
.sw input,.dayt input,.seg input{position:absolute;opacity:0;pointer-events:none}
.sw i{display:block;width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px transparent;cursor:pointer}
.sw input:checked+i{box-shadow:0 0 0 2px var(--c)}
.sw input:focus-visible+i,.dayt input:focus-visible+b,.seg input:focus-visible+b{outline:2px solid var(--acc);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayt b{display:grid;place-items:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:14px;color:var(--ink);cursor:pointer}
.dayt input:checked+b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg b{display:grid;place-items:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:15px;cursor:pointer}
.seg input:checked+b{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dsec{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.dsec p{font-size:14px;color:var(--mute);font-weight:400;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;width:max-content;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s;box-shadow:0 10px 30px rgb(0 0 0/.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:32px;padding:0 4px}
@media(min-width:760px){#toast{bottom:24px;left:calc(50% + 48px)}}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
#lock[hidden]{display:none}
.lockbox{display:grid;gap:14px;justify-items:center;text-align:center;width:min(360px,100%)}
.lockbox img{width:72px;height:72px;border-radius:18px}
.lockbox h1{font-size:26px}
.lockbox input{text-align:center;font-size:22px;letter-spacing:.15em}
.lockbox .btn{width:100%}
.err{color:var(--bad);min-height:1.4em;font-weight:600;font-size:14px;margin:0}
.warn{color:var(--bad);font-size:14px;font-weight:600;margin:0 0 4px}
body.locked>nav,body.locked>main,body.locked>#toast{visibility:hidden}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<main>
  <div class="wrap">
    <header class="top">
      <h1 id="title">Today</h1>
      <button class="ibtn" data-a="lockNow" aria-label="Lock Keel now" id="lockTop" hidden></button>
      <button class="ibtn" data-a="settings" aria-label="Settings and backup" id="gear"></button>
    </header>
    <section id="view" aria-live="off"></section>
  </div>
</main>
<div id="lock" hidden><form id="lockForm" class="lockbox" autocomplete="off">
  <img src="icon-192.png" alt="">
  <h1>Keel is locked</h1>
  <p class="mute">Enter your passcode to open your habits and journal.</p>
  <input type="password" id="lockIn" autocomplete="off" aria-label="Passcode" required>
  <button class="btn pri" id="lockGo">Unlock</button>
  <p class="err" id="lockErr" role="alert"></p>

/* merge two data sets (for moving data between devices) */
function merge(a,b){

 const byId=(xa,xb,f)=>{const m=new Map(xa.map(x=>[x.id,x]));for(const y of xb){const x=m.get(y.id);m.set(y.id,x?f(x,y):y)}return[...m.values()].filter(alive)};

function vToday(){

function heat(h){
 const fk=firstKey(h),t=new Date(),tk=key(t),mon=addDays(t,-((t.getDay()+6)%7)),start=addDays(mon,-17*7);let out='';
 for(let i=0;i<18*7;i++){const d=addDays(start,i),k=key(d);
  const cls=k>tk?'f':isDone(h,k)?'y':sched(h,d)&&k>=fk?'s':'';
  out+=`<b class="${cls}" title="${fmtDate(d,{day:'numeric',month:'short'})}${cls==='y'?' · done':''}"></b>`}
 return out}

 <label class="fld"><span>What happened? (optional)</span><textarea name="note" style="min-height:90px" maxlength="300" placeholder="Triggers, time of day, how you felt…"></textarea></label>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn danger">Reset counter</button></div>`,
 fd=>{snap();const t=now();c.resets.push({at:t,len:t-c.start,note:(fd.get('note')||'').trim()});c.start=t;c.u=t;save();closeDlg();render();toast('Counter reset. Fresh start.','Undo',undo)})}
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
function settingsDlg(){
 const np='Notification' in window?Notification.permission:'unsupported';
 const canShare=!!(navigator.canShare&&window.File&&navigator.canShare({files:[new File(['{}'],'x.json',{type:'application/json'})]}));
 openDlg(`<h2>Settings</h2>
 <div class="fld"><span>Theme</span><div class="seg">${['system','light','dark'].map(t=>`<label><input type="radio" name="theme" value="${t}" ${S.theme===t?'checked':''}><b>${t[0].toUpperCase()+t.slice(1)}</b></label>`).join('')}</div></div>
 <div class="fld dsec"><span>Backup and moving data between devices</span><p>Everything is stored on this device only. To copy it to your other device, export a backup here and import it there. Imports merge, so nothing on either device is overwritten. Last export: ${S.lastExport?fmtDT(S.lastExport):'never'}.</p>
  <div class="row"><button type="button" class="btn" data-a="export">Export backup</button>${canShare?'<button type="button" class="btn" data-a="shareBk">Share backup</button>':''}<label class="btn" tabindex="0">Import and merge<input type="file" id="importF" accept=".json,application/json" hidden></label></div></div>
 <div class="fld dsec"><span>Timer alerts</span><p>${np==='granted'?'Notifications are on for the focus timer.':np==='denied'?'Notifications are blocked. Turn them on in your browser or phone settings for this app.':np==='unsupported'?'This browser does not support notifications.':'Allow notifications so the timer can alert you when Keel is in the background.'}</p>
  ${np==='default'?'<button type="button" class="btn" data-a="notif">Allow notifications</button>':''}</div>
 ${installEvt?'<div class="fld dsec"><span>Install</span><p>Add Keel to your home screen or app launcher so it opens like a normal app.</p><button type="button" class="btn pri" data-a="install">Install Keel</button></div>':''}
 <div class="fld dsec"><span>Passcode lock</span>${LK?`<p>On. Everything on this device, including your journal, is encrypted with your passcode, and so are backups you export.</p>
  <label class="fld" style="margin-bottom:10px"><span>Lock again after leaving Keel</span>${delaySel(lockDelay)}</label>
  <div class="row"><button type="button" class="btn" data-a="lockNow">Lock now</button><button type="button" class="btn" data-a="lockChange">Change passcode</button><button type="button" class="btn danger" data-a="lockOff">Turn off</button></div>`
  :`<p>Ask for a passcode when Keel opens, and encrypt your journal and everything else on this device.</p><button type="button" class="btn" data-a="lockSetup">${I.lock} Set up passcode lock</button>`}</div>
 <div class="fld dsec"><span>Erase</span><p>Removes every habit, entry, counter, task and focus session from this device.</p><button type="button" class="btn danger" data-a="wipe">Erase all data</button></div>
 <div class="row end"><button type="button" class="btn pri" data-a="close">Done</button></div>`,()=>closeDlg())}
async function backupBlob(){const base={v:1,app:'keel',exportedAt:now()};const body=LK?{...base,enc:await encryptObj(S,LK,LSALT,LIT)}:{...S,...base};return new Blob([JSON.stringify(body)],{type:'application/json'})}
const backupName=()=>`keel-backup-${key()}.json`;

/* ---------- passcode lock ---------- */
function showLock(){document.body.classList.add('locked');$('#lock').hidden=false;$('#lockErr').textContent='';const i=$('#lockIn');i.value='';setTimeout(()=>i.focus(),50)}
function hideLock(){document.body.classList.remove('locked');$('#lock').hidden=true}
async function lockApp(){if(!LK||locked)return;flushJournal();saveNow();await writing;
 locked=true;LK=null;LSALT=null;S=blank();undoSnap=null;if(dlg.open){onCancel=null;dlg.close()}
 $('#view').innerHTML='';$('#toast').classList.remove('show');wake(false);document.title='Keel';showLock()}
async function unlock(pass){const err=$('#lockErr'),btn=$('#lockGo');
 if(now()<waitUntil){err.textContent=`Too many tries. Wait ${Math.ceil((waitUntil-now())/1000)} seconds.`;return}
 let raw;try{raw=JSON.parse(localStorage.getItem(STORE))}catch(e){}
 if(!raw||!okEnc(raw.enc)){locked=false;hideLock();S=load();go(cur);return}
 btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
 try{const salt=b64d(raw.enc.salt),key=await deriveKey(pass,salt,+raw.enc.it),d=await decryptObj(raw.enc,key);
  LK=key;LSALT=salt;LIT=+raw.enc.it;S=normalize(d);lockDelay=[0,1,5,15].includes(+S.lockDelay)?+S.lockDelay:1;locked=false;fails=0;hiddenAt=0;hideLock();
  applyTheme();tidyTodos();if(T.running&&now()>=T.endAt)tComplete();go(cur)}
 catch(e){fails++;if(fails>=5){fails=0;waitUntil=now()+30000;err.textContent='Wrong passcode. Too many tries, wait 30 seconds.'}else err.textContent='Wrong passcode. Try again.';
  const i=$('#lockIn');i.value='';i.focus()}
 finally{btn.disabled=false;btn.textContent='Unlock'}}
async function checkPass(pass){await writing;let raw;try{raw=JSON.parse(localStorage.getItem(STORE))}catch(e){}if(!raw||!okEnc(raw.enc))return false;
 try{const k=await deriveKey(pass,b64d(raw.enc.salt),+raw.enc.it);await decryptObj(raw.enc,k);return true}catch(e){return false}}
const DELAYS=[[0,'Immediately'],[1,'After 1 minute'],[5,'After 5 minutes'],[15,'After 15 minutes']];
const delaySel=v=>`<select name="lockDelay">${DELAYS.map(([m,n])=>`<option value="${m}" ${m===v?'selected':''}>${n}</option>`).join('')}</select>`;
async function busy(f,label,fn){const b=f.querySelector('button:not([type=button])'),t=b.textContent;b.disabled=true;b.textContent=label;try{return await fn()}finally{b.disabled=false;b.textContent=t}}
function setErr(m){const e=$('#dErr');if(e)e.textContent=m}
function lockSetupDlg(){openDlg(`<h2>Set a passcode</h2>
 <p class="mute" style="margin-bottom:14px">Keel will ask for it when it opens, and everything it stores on this device, including your journal, will be encrypted with it.</p>
 <label class="fld"><span>Passcode (at least 4 characters)</span><input type="password" name="p1" required minlength="4" autocomplete="new-password"></label>
 <label class="fld"><span>Type it again</span><input type="password" name="p2" required autocomplete="new-password"></label>
 <label class="fld"><span>Lock again after leaving Keel</span>${delaySel(1)}</label>
 <p class="warn">If you forget this passcode, nobody can recover your data, not even with a backup made while the lock is on.</p>
 <p class="err" id="dErr"></p>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pri">Turn on lock</button></div>`,
 async(fd,f)=>{const p1=fd.get('p1')||'',p2=fd.get('p2')||'';if(p1.length<4)return setErr('Use at least 4 characters.');if(p1!==p2)return setErr("The two passcodes don't match.");
  await busy(f,'Encrypting…',async()=>{const salt=crypto.getRandomValues(new Uint8Array(16));const k=await deriveKey(p1,salt,ITER);
   LK=k;LSALT=salt;LIT=ITER;S.lockDelay=+fd.get('lockDelay');lockDelay=S.lockDelay;await saveNow()});
  closeDlg();render();toast('Passcode lock is on. Your data is encrypted.')})}
function lockChangeDlg(){openDlg(`<h2>Change passcode</h2>
 <label class="fld"><span>Current passcode</span><input type="password" name="old" required autocomplete="current-password"></label>
 <label class="fld"><span>New passcode (at least 4 characters)</span><input type="password" name="p1" required minlength="4" autocomplete="new-password"></label>
 <label class="fld"><span>Type the new one again</span><input type="password" name="p2" required autocomplete="new-password"></label>
 <p class="err" id="dErr"></p>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pri">Change passcode</button></div>`,
 async(fd,f)=>{const p1=fd.get('p1')||'',p2=fd.get('p2')||'';if(p1.length<4)return setErr('Use at least 4 characters.');if(p1!==p2)return setErr("The new passcodes don't match.");
  const ok=await busy(f,'Checking…',async()=>{if(!await checkPass(fd.get('old')||''))return false;const salt=crypto.getRandomValues(new Uint8Array(16));
   LK=await deriveKey(p1,salt,ITER);LSALT=salt;LIT=ITER;await saveNow();return true});
  if(!ok)return setErr('Current passcode is wrong.');closeDlg();toast('Passcode changed.')})}
function lockOffDlg(){openDlg(`<h2>Turn off the lock?</h2>
 <p class="mute" style="margin-bottom:14px">Keel will open without a passcode and your data will be stored unencrypted on this device.</p>
 <label class="fld"><span>Current passcode</span><input type="password" name="old" required autocomplete="current-password"></label>
 <p class="err" id="dErr"></p>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn danger">Turn off lock</button></div>`,
 async(fd,f)=>{const ok=await busy(f,'Checking…',async()=>{if(!await checkPass(fd.get('old')||''))return false;LK=null;LSALT=null;await saveNow();return true});
  if(!ok)return setErr('Passcode is wrong.');closeDlg();render();toast('Lock turned off.')})}
function importLockedDlg(d){openDlg(`<h2>This backup is locked</h2>
 <p class="mute" style="margin-bottom:14px">It was made while the passcode lock was on${d.exportedAt?' ('+fmtDT(d.exportedAt)+')':''}. Enter the passcode that was in use then.</p>
 <label class="fld"><span>Backup passcode</span><input type="password" name="old" required autocomplete="off"></label>
 <p class="err" id="dErr"></p>
 <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn pri">Unlock and merge</button></div>`,
 async(fd,f)=>{const inner=await busy(f,'Decrypting…',async()=>{try{return await decryptObj(d.enc,await deriveKey(fd.get('old')||'',b64d(d.enc.salt),+d.enc.it))}catch(e){return null}});
  if(!inner)return setErr('That passcode does not open this backup.');
  if(!inner.v||!Array.isArray(inner.habits))return setErr('This backup is damaged.');
  doMerge(inner,d.exportedAt)})}
function doMerge(d,at){snap();S=merge(S,normalize(d));save();saveNow();closeDlg();render();toast(`Merged backup${at?' from '+fmtDT(at):''}`,'Undo',undo)}

/* ---------- actions ---------- */
const A={
 go:b=>go(b.dataset.v),
 settings:()=>settingsDlg(),
 lockNow:()=>lockApp(),lockSetup:()=>lockSetupDlg(),lockChange:()=>lockChangeDlg(),lockOff:()=>lockOffDlg(),
 forgot:async()=>{if(!await confirmBox('Erase Keel and start over?',"Without the passcode the data on this device can't be decrypted, so the only way forward is to delete it. If your other device still has your data, you can send a backup from it afterwards.",'Erase and start over',true))return;
  try{localStorage.removeItem(STORE)}catch(e){}LK=null;LSALT=null;locked=false;S=blank();hideLock();applyTheme();go(cur);toast('Keel was reset.')},
 close:()=>{const c=closeDlg();c&&c()},
 tog:b=>toggleHabit(b.dataset.id,b.dataset.k),
 newHabit:()=>habitDlg(),editHabit:b=>habitDlg(b.dataset.id),
 quickHabit:b=>{S.habits.push({id:uid(),name:b.dataset.n,color:COLORS[S.habits.length%COLORS.length],days:[0,1,2,3,4,5,6],log:{},created:key(),u:now()});save();render();toast(`Added "${b.dataset.n}"`)},
 preset:b=>{$$('input[name=d]',dform).forEach(i=>i.checked=b.dataset.p.includes(i.value))},
 delHabit:async b=>{const h=S.habits.find(x=>x.id===b.dataset.id);closeDlg();if(!await confirmBox('Delete this habit?',`"${h.name}" and all its history will be removed.`,'Delete',true))return;
  snap();S.habits=S.habits.filter(x=>x!==h);tomb(h.id);save();render();toast('Habit deleted','Undo',undo)},
 todo:b=>{const x=S.todos.find(t=>t.id===b.dataset.id);if(!x)return;x.done=!x.done;x.doneAt=x.done?now():0;x.u=now();save();render()},
 delTodo:b=>{snap();S.todos=S.todos.filter(t=>t.id!==b.dataset.id);tomb(b.dataset.id);save();render();toast('Task deleted','Undo',undo)},
 clearDone:()=>{snap();S.todos.filter(t=>t.done).forEach(t=>tomb(t.id));S.todos=S.todos.filter(t=>!t.done);save();render();toast('Cleared finished tasks','Undo',undo)},
 qmood:b=>{const k=key(),m=+b.dataset.m,e=S.journal[k]||{};setEntry(k,{mood:e.mood===m?0:m});render()},
 tgo:()=>{tStart();if(cur==='today')render()},tpause:()=>{tPause();if(cur==='today')render()},
 ttoggle:()=>T.running?tPause():tStart(),treset:()=>tReset(),tskip:()=>tSkip(),tmode:async b=>{const m=b.dataset.m;if(m===T.mode)return;if(T.running&&!await confirmBox('Stop the running timer?','Switching mode resets the current countdown.','Switch',false))return;tMode(m)},
 jprev:()=>{curJ=key(addDays(fromKey(curJ),-1));render()},
 jnext:()=>{const n=key(addDays(fromKey(curJ),1));if(n<=key()){curJ=n;render()}},
 jtoday:()=>{curJ=key();render()},
 jmore:()=>{jLimit+=60;renderJList()},
 openJ:b=>{curJ=b.dataset.k;render();window.scrollTo({top:0,behavior:'smooth'})},
 mood:b=>{const m=+b.dataset.m,e=S.journal[curJ]||{};setEntry(curJ,{mood:e.mood===m?0:m,text:$('#jText').value});render()},
 prompt:b=>{const ta=$('#jText'),v=ta.value,ins=(v&&!v.endsWith('\n')?'\n\n':'')+b.dataset.p+'\n';ta.value=v+ins;ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length;setEntry(curJ,{text:ta.value});updCount()},
 delEntry:async()=>{if(!await confirmBox('Delete this entry?',fmtDate(fromKey(curJ))+' will be removed.','Delete',true))return;snap();delete S.journal[curJ];S.deleted['j:'+curJ]=now();save();render();toast('Entry deleted','Undo',undo)},
 newCounter:()=>counterDlg(),editCounter:b=>counterDlg(b.dataset.id),quickCounter:b=>counterDlg(null,b.dataset.n),
 resetCounter:b=>resetDlg(b.dataset.id),
 delCounter:async b=>{const c=S.counters.find(x=>x.id===b.dataset.id);closeDlg();if(!await confirmBox('Delete this counter?',`"${c.name}" and its history will be removed.`,'Delete',true))return;
  snap();S.counters=S.counters.filter(x=>x!==c);tomb(c.id);save();render();toast('Counter deleted','Undo',undo)},
 export:async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await backupBlob());a.download=backupName();document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);S.lastExport=now();save();toast(LK?'Encrypted backup saved to your downloads':'Backup saved to your downloads')},
 shareBk:async()=>{try{await navigator.share({files:[new File([await backupBlob()],backupName(),{type:'application/json'})],title:'Keel backup'});S.lastExport=now();save()}catch(e){}},
 notif:async()=>{try{await Notification.requestPermission()}catch(e){}closeDlg();settingsDlg()},
 install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;closeDlg()},
 wipe:async()=>{closeDlg();if(!await confirmBox('Erase everything?','All habits, journal entries, counters, tasks and focus history on this device will be deleted. Export a backup first if you might want them.','Erase all',true))return;
  snap();const th=S.theme;S=blank();S.theme=th;save();saveNow();render();toast('All data erased','Undo',undo)}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();
 if(f.id==='todoForm'){const t=(new FormData(f).get('t')||'').trim();if(!t)return;S.todos.push({id:uid(),text:t,done:false,doneAt:0,u:now()});save();render();$('#todoForm input')?.focus()}
 else if(f.id==='lockForm'){const v=$('#lockIn').value;if(v)unlock(v)}
 else if(f.id==='dlgForm'&&onSubmit)onSubmit(new FormData(f),f)});
let jTimer;
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='jText'){updCount();clearTimeout(jTimer);const k=curJ,v=t.value;jTimer=setTimeout(()=>setEntry(k,{text:v}),300)}
 else if(t.id==='jSearch'){jLimit=60;renderJList()}
 else if(t.id==='tLabel'){T.label=t.value;saveT()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='jDate'&&t.value){curJ=t.value>key()?key():t.value;render()}
 else if(t.id==='jText'){clearTimeout(jTimer);setEntry(curJ,{text:t.value});renderJList()}
 else if(t.dataset.f){const k=t.dataset.f;if(t.type==='checkbox')S.focus[k]=t.checked;else{const lim={work:[1,240],short:[1,60],long:[1,120],every:[1,12]}[k];S.focus[k]=clamp(Math.round(+t.value)||lim[0],...lim);t.value=S.focus[k]}
  if(!T.running&&!T.total)T.left=dur(T.mode);saveT();save();updTimer()}
 else if(t.name==='theme'){S.theme=t.value;save();applyTheme()}
 else if(t.name==='lockDelay'&&LK){lockDelay=+t.value;S.lockDelay=lockDelay;save()}
 else if(t.id==='importF'&&t.files[0]){const file=t.files[0];file.text().then(txt=>{const d=JSON.parse(txt);if(d&&okEnc(d.enc)){importLockedDlg(d);return}if(!d||!d.v||!Array.isArray(d.habits))throw 0;doMerge(d,d.exportedAt)}).catch(()=>toast('That file is not a Keel backup'))}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id){d.open?openDetails.add(d.dataset.id):openDetails.delete(d.dataset.id)}},true);
document.addEventListener('keydown',e=>{if(e.key===' '&&!locked&&cur==='focus'&&!e.target.closest('input,textarea,button,select,dialog')){e.preventDefault();T.running?tPause():tStart()}});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==cur)go(v)});
addEventListener('pagehide',saveNow);
let lastDay=key();
function lockedAlert(){T.alerted=true;saveT();if(S.focus.sound!==false)chime();try{navigator.vibrate&&navigator.vibrate([220,120,220])}catch(e){}
 if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)
  navigator.serviceWorker.ready.then(r=>r.showNotification('Keel',{body:'Your timer is done.',tag:'keel-timer',renotify:true,icon:'icon-192.png'})).catch(()=>{})}
function tick(){if(locked){if(T.running&&now()>=T.endAt&&!T.alerted)lockedAlert();return}
 if(T.running&&now()>=T.endAt)tComplete();
 if(key()!==lastDay){lastDay=key();tidyTodos();if(curJ<lastDay&&cur!=='journal')curJ=lastDay;render();return}
 updTimer();if(cur==='since'||cur==='today')updCounters()}
setInterval(tick,500);
function flushJournal(){const ta=$('#jText');if(!ta||locked)return;clearTimeout(jTimer);if(ta.value!==((S.journal[curJ]||{}).text||''))setEntry(curJ,{text:ta.value})}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){flushJournal();saveNow();hiddenAt=now();if(LK&&lockDelay===0)lockApp()}
 else{if(LK&&!locked&&hiddenAt&&now()-hiddenAt>=lockDelay*6e4){lockApp();return}hiddenAt=0;tick();if(T.running&&!locked)wake(true)}});
addEventListener('pagehide',flushJournal);

function applyTheme(){const r=document.documentElement;let th=S.theme;try{if(locked)th=localStorage.getItem('keel:theme')||'system';else localStorage.setItem('keel:theme',th)}catch(e){}
 if(th==='light'||th==='dark')r.dataset.theme=th;else r.removeAttribute('data-theme');
 requestAnimationFrame(()=>{const m=$('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor})}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

/* ---------- boot ---------- */
document.addEventListener('pointerdown',unlockAudio,{once:true});
$('#nav').innerHTML=`<div class="brand"><img src="icon-192.png" alt="Keel"></div>`+Object.keys(VIEWS).map(v=>`<button data-a="go" data-v="${v}"><span class="ic">${I[v]}</span>${VIEWS[v].n}</button>`).join('');
$('#gear').innerHTML=I.gear;$('#lockTop').innerHTML=I.lock;
applyTheme();
if(locked)showLock();else if(T.running&&now()>=T.endAt)tComplete();
go(cur);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
